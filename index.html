<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apu's Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md">
    <header class="flex justify-between items-center py-4 border-b border-gray-700">
      <h1 class="text-2xl font-bold tracking-wide">📝 Apu's Notes</h1>
      <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">লগইন</button>
      <div id="userSection" class="hidden flex items-center gap-2">
        <span id="userName" class="text-xs text-gray-300"></span>
        <button id="logoutBtn" class="bg-red-500/20 text-red-400 px-3 py-1 rounded text-xs">লগআউট</button>
      </div>
    </header>

    <form id="noteForm" class="mt-6 flex gap-2">
      <input type="text" id="noteInput" placeholder="নতুন কিছু লিখুন..." required class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-lg focus:outline-none border border-gray-700 focus:border-blue-500 text-sm">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold text-sm">+</button>
    </form>

    <div id="notesList" class="mt-6 flex flex-col gap-3">
      <p class="text-gray-400 text-center text-sm">
